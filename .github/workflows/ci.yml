name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build, test, and package
        shell: pwsh
        run: ./build.ps1 -Test -TestMode Core -Package
      - name: Upload verification
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verification
          path: artifacts/core/verification.json
          if-no-files-found: warn
      - name: Upload portable package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SidecarDisplay-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
